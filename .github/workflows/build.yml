name: DevSecOps Utilities Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # JOB1: Build
  build:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install typechecks
        run: npm run test

      - name: Build frontend and backend
        run: npm run build

      - name: Save compiled dist files
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-dist
          path: |
              backend/dist
              frontend/dist
              backend/package.json
              package.json
              package-lock.json

  # JOB 2: Security Scan
  security-scan:
    name: Trivy SCA
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .

      - name: Setup Node.js and Install Dependencies for Full tree scan
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Restore Dependencies
        run: npm ci


      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.json'
          exit-code: '0'

      - name: Upload to OWASP Dependency Track
        env:
          DT_API_KEY: ${{secrets.DEPENDENCY_TRACK_API_KEY}}
          DT_SERVER: ${{secrets.DEPENDENCY_TRACK_URL}}
        run: |
            curl --show-error --silent --fail-with-body \
            -X POST "${DT_SERVER%/}" \
            -H "X-Api-Key: $DT_API_KEY" \
            -H "Content-Type: multipart/form-data" \
            -F "projectName=DevSecOpsUtilities" \
            -F "projectVersion=1.0" \
            -F "autoCreate=true" \
            -F "bom=@sbom.json"
            

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          
      - name: Run Trivy Filesystem Scan (Full Built Tree)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'sca.json'
          exit-code: '0'

      - name: Convert Trivy JSON to CSV using jq
        run: |
          set -euo pipefail

          jq -r '
            ["Target", "Package", "VulnerabilityID", "Severity",
             "InstalledVersion", "FixedVersion", "Title"],
            (.Results[]? |
              .Target as $target |
              .Vulnerabilities[]? |
              [$target, .PkgName, .VulnerabilityID, .Severity,
               .InstalledVersion, (.FixedVersion // "N/A"),
               (.Title // "N/A")]
            ) | @csv
          ' sca.json > sca.csv

          echo "Preview of CSV scan results:"
          head -n 15 sca.csv

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
              sca.json
              sca.csv
          if-no-files-found: error
          
        
  push-to-registry:
    name: Create Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}
      
      - name: set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{secrets.DOCKERHUB_URL}}:latest